[project]
name = "dewey"
version = "0.1.1"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "pypdf>=6.0.0",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "ruff>=0.16.0",
    "ty>=0.0.17",
]

[tool.ruff]
target-version = "py314"

[tool.ty.src]
include = ["main.py", "lib"]
respect-ignore-files = true
